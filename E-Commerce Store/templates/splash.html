{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA/FORM</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <style>
    body, html {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: 'Inter', sans-serif;
    }
    .splash-container {
      position: relative;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      /* Vibrant animated gradient */
      background: linear-gradient(45deg, #ff0055, #ffb347, #4ca1af, #8e44ad);
      background-size: 300% 300%;
      animation: gradientBG 10s ease infinite;
    }
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    .splash-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }
    .splash-content {
      position: relative;
      z-index: 10;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .splash-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(3rem, 10vw, 8rem);
      font-weight: 300;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin: 0;
      opacity: 0;
      transform: translateY(30px);
      text-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }
    .splash-enter {
      margin-top: 60px;
      font-size: 14px;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #fff;
      text-decoration: none;
      padding: 16px 48px;
      border: 1px solid rgba(255, 255, 255, 0.5);
      border-radius: 40px;
      background: rgba(255, 255, 255, 0.05);
      transition: all 0.4s ease;
      opacity: 0;
      transform: translateY(20px);
      backdrop-filter: blur(5px);
    }
    .splash-enter:hover {
      background-color: #fff;
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  
  <div class="splash-container">
    <div class="splash-overlay"></div>
    <div class="splash-content">
      <h1 class="splash-title" id="splash-title">NOVA/FORM</h1>
      <a href="{% url 'store:home' %}" class="splash-enter" id="splash-enter">Enter Experience</a>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const tl = gsap.timeline();
      tl.to('#splash-title', { opacity: 1, y: 0, duration: 1.5, ease: "power3.out", delay: 0.3 })
        .to('#splash-enter', { opacity: 1, y: 0, duration: 1.2, ease: "power3.out" }, "-=0.8");
    });
  </script>
</body>
</html>
