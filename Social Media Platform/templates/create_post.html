{% extends 'base.html' %}

{% block content %}
<div class="create-post-container">
    <h2>CREATE SOMETHING.</h2>
    <form method="post" enctype="multipart/form-data" class="premium-form">
        {% csrf_token %}
        <div class="form-group">
            <label for="{{ form.image.id_for_label }}">Upload Image</label>
            {{ form.image }}
        </div>
        <div class="form-group">
            <label for="{{ form.caption.id_for_label }}">Caption</label>
            {{ form.caption }}
        </div>
        <div class="form-group">
            <label for="{{ form.location.id_for_label }}">Location</label>
            {{ form.location }}
        </div>
        <button type="submit" class="cta-button" style="align-self: flex-start; margin-top: 2rem;">PUBLISH &rarr;</button>
    </form>
</div>
{% endblock %}
